<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineBook - Premium Movie Ticket Booking</title>
    <meta name="description" content="Book cinema tickets for IMAX, 3D, and Dolby Atmos shows instantly with eSewa payments." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen antialiased bg-gray-50 text-gray-900 selection:bg-rose-500 selection:text-white dark:bg-gray-950 dark:text-gray-100 dark:selection:bg-rose-500 dark:selection:text-white">
    <div id="root"></div>
    <script>
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('cinebook-theme'));
          var theme = stored && stored.state && stored.state.theme;
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
